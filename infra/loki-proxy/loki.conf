server {
  listen 3100;

  # Upstream body can be large when Pino batches logs.
  client_max_body_size 10m;

  auth_basic "Loki";
  auth_basic_user_file /tmp/.htpasswd;

  # Only the push endpoint is proxied. Reads stay on the internal monitoring
  # network (Grafana reaches Loki directly), so external clients get 404 for
  # every other path and cannot enumerate or query logs through this proxy.
  location = /loki/api/v1/push {
    proxy_pass http://loki:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }

  # Unauthenticated readiness probe so `docker compose ps` / healthchecks work
  # without baking the basic-auth secret into the healthcheck command.
  location = /ready {
    auth_basic off;
    proxy_pass http://loki:3100;
  }

  location / {
    return 404;
  }
}
