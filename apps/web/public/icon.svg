<svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circle background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" stroke="white" stroke-width="0.5" stroke-opacity="0.2" fill="none"/>

  <!-- Stethoscope earpieces -->
  <circle cx="14" cy="13" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="28" cy="13" r="3" fill="white" fill-opacity="0.9"/>

  <!-- Stethoscope tube connecting earpieces -->
  <path d="M14 16 Q14 22 21 22 Q28 22 28 16" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Stethoscope tube going down to chest piece -->
  <path d="M21 22 Q21 34 30 40" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Stethoscope chest piece -->
  <circle cx="33" cy="43" r="7" stroke="white" stroke-width="2.2" fill="white" fill-opacity="0.12"/>
  <circle cx="33" cy="43" r="2.5" fill="white" fill-opacity="0.95" filter="url(#glow)"/>

  <!-- Microphone body -->
  <rect x="38" y="10" width="10" height="16" rx="5" fill="white" fill-opacity="0.95"/>

  <!-- Mic grille lines -->
  <line x1="39" y1="15" x2="47" y2="15" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="39" y1="18" x2="47" y2="18" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="39" y1="21" x2="47" y2="21" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Mic arc -->
  <path d="M35 24 Q35 32 43 32 Q51 32 51 24" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Mic stand -->
  <line x1="43" y1="32" x2="43" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="48" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Sound wave dots -->
  <circle cx="10" cy="46" r="1.5" fill="white" fill-opacity="0.5"/>
  <circle cx="15" cy="42" r="1.5" fill="white" fill-opacity="0.65"/>
  <circle cx="10" cy="52" r="1.5" fill="white" fill-opacity="0.35"/>
</svg>
